# Static configuration file for Traefik
# This file provides additional configuration options

api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: traefik-network

# Certificate resolvers for Let's Encrypt (for production)
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: your-email@example.com
#       storage: /letsencrypt/acme.json
#       tlsChallenge: {}

# Logging configuration
log:
  level: INFO

accessLog: {}

# Global redirect to HTTPS (uncomment for production)
# http:
#   redirections:
#     entrypoint:
#       to: websecure
#       scheme: https
